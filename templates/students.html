<!DOCTYPE html>
<html>

<head>

<title>Students List</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<h1>All Students</h1>


<table border="1">


<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Year</th>
<th>Action</th>

</tr>



{% for student in students %}


<tr>

<td>{{student[0]}}</td>

<td>{{student[1]}}</td>

<td>{{student[2]}}</td>

<td>{{student[3]}}</td>

<td>{{student[4]}}</td>


<td>

<a href="/update/{{student[0]}}">
<button>Update</button>
</a>


<a href="/delete/{{student[0]}}">
<button>Delete</button>
</a>


</td>


</tr>


{% endfor %}



</table>


<br>


<a href="/">
<button>Add New Student</button>
</a>


</body>

</html>
